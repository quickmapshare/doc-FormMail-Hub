name: AI Auto Update Docs

on:
  repository_dispatch:
    types: [source_updated]
  workflow_dispatch:

# 1. ÉP QUYỀN GHI TRỰC TIẾP Ở ĐÂY (Vượt qua mọi cài đặt Settings)
permissions:
  contents: write

jobs:
  update-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          # THAY DÒNG NÀY: Dùng Token cá nhân thay vì Token của Bot
          token: ${{ secrets.DOCS_PAT }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install google-genai

      - name: Run AI Update Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CODE_DIFF: ${{ github.event.client_payload.code_diff }}
        run: python .github/scripts/update_docs.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Add toàn bộ thư mục docs/ để bắt được các file mới AI tạo ra
          git add src/content/docs/
          
          # Kiểm tra nếu có thay đổi thì mới commit
          git diff --quiet && git diff --staged --quiet || git commit -m "docs: AI auto-generated new pages & updates [English]"
          
          # CẬP NHẬT QUAN TRỌNG: Kéo bản mới nhất trên GitHub về và gộp lại trước khi đẩy lên
          git pull --rebase origin main
          
          # 3. Ép push bằng token có quyền write
          git push origin HEAD:main
