name: AI Docs Update Proposal

# Nhận diff từ repo FormMail Hub (repository_dispatch) rồi để AI ĐỀ XUẤT sửa tài liệu.
# Kết quả là một Pull Request để duyệt; không còn push thẳng lên main (từ 2026-10-10).
on:
  repository_dispatch:
    types: [source_updated]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ai-docs-update
  cancel-in-progress: false

jobs:
  propose-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install google-genai

      - name: Ask AI for documentation changes
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CODE_DIFF: ${{ github.event.client_payload.code_diff }}
        run: python .github/scripts/update_docs.py

      - name: Open or update pull request
        uses: peter-evans/create-pull-request@v7
        with:
          # PAT để PR do bot tạo vẫn kích hoạt build preview của Cloudflare Pages
          token: ${{ secrets.DOCS_PAT }}
          branch: bot/docs-update
          delete-branch: true
          add-paths: src/content/docs/**
          commit-message: "docs: AI đề xuất cập nhật tài liệu theo thay đổi mã nguồn"
          title: "docs: AI đề xuất cập nhật tài liệu"
          body: |
            AI đề xuất sửa các trang tài liệu bị ảnh hưởng bởi thay đổi mã nguồn gần nhất của FormMail Hub.

            Kiểm tra trước khi merge:
            - Nội dung đúng với sản phẩm hiện tại và `PRODUCT_RULES.md`.
            - Không có thông tin nhạy cảm (key, mật khẩu, email nội bộ).
            - Không có câu quảng cáo phóng đại.

            Merge = xuất bản lên doc.formmailhub.com. Đóng PR nếu không cần sửa.
